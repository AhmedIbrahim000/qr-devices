<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Table</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            /* Background image */
            background-image: url("D:/Programes/Projects/QR Code/colorful-bright-cloudy-sky-dlifrmi6cblxsbvd.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            /* Center all content */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Logo styling */
        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
        }
            
        .logo img {
            height: 200px;
            border-radius: 40px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        }

        .container {
            background: rgb(234, 254, 253);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            text-align: center;
        }

        table {
            border-collapse: collapse;
            margin: 0 auto;
            width: 100%;
        }

        th, td {
            border: 1px solid #444;
            padding: 8px 12px;
        }

        th {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <img src="logo2.png" alt="Logo">
        </div>
        
        <h2>Student Scores</h2>

        <table>
            <tr>
                <th>No</th>
                <th>Name</th>
                <th>Model</th>
                <th>Windows</th>
                <th>CPU</th>
                <th>RAM</th>
                <th>Disk Storage</th>
                <th>Hardware Issues</th>
                <th>Oracle</th>
                <th>Notes</th>
            </tr>
            <tr>
                <td>1</td>
                <td>Ahmed</td>
                <td>90</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Sara</td>
                <td>85</td>
            </tr>
        </table>
    </div>

</body>
</html>
