<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Device Information</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;

    background-image: url("colorful-bright-cloudy-sky-dlifrmi6cblxsbvd.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Logo */
.logo {
    margin-top: 20px;
    text-align: center;
}

.logo img {
    height: 200px;
    border-radius: 40px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
}

/* Info box */
.container {
    background: rgb(234, 254, 253);
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    text-align: center;
    max-width: 900px;
    margin-top: 20px;
}

/* Table */
table {
    border-collapse: collapse;
    margin: 0 auto;
    width: 100%;
}

th, td {
    border: 1px solid #444;
    padding: 8px 12px;
}

th {
    background-color: #f0f0f0;
}
</style>
</head>

<body>

    <!-- Logo -->
    <div class="logo">
        <img src="logo2.png" alt="Logo">
    </div>

    <!-- Device Info -->
    <div class="container">
        <h2>Device Information</h2>
        <table id="deviceTable"></table>
    </div>

    <script>
    const params = new URLSearchParams(window.location.search);
    const deviceId = params.get("id");

    fetch("PC's Sheet.csv")
        .then(response => response.text())
        .then(csv => {
            const rows = csv.trim().split("\n");
            const headers = rows[0].split(",");
            const table = document.getElementById("deviceTable");

            for (let i = 1; i < rows.length; i++) {
                const cells = rows[i].split(",");

                if (cells[0] === deviceId) {
                    headers.forEach((header, index) => {
                        const tr = document.createElement("tr");
                        tr.innerHTML = `<th>${header}</th><td>${cells[index] || ""}</td>`;
                        table.appendChild(tr);
                    });
                }
            }
        })
        .catch(err => {
            document.getElementById("deviceTable").innerHTML =
                "<tr><td>Error loading device data</td></tr>";
        });
    </script>

</body>
</html>
